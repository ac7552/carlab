[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carlab"
version = "0.1.0"
description = "See a car with new paint, a wrap, paint protection film and wheels: a 3D car built from a listing or photo, in one web page."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
carlab = "carlab.__main__:main"

[tool.setuptools.packages.find]
include = ["carlab*"]

[tool.setuptools.package-data]
carlab = ["data/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
